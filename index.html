    <script>
      // Suppress benign Vite HMR WebSocket connection errors in AI Studio iframe environment
      (function() {
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('@vite/client') !== -1) ||
            (event.message && (
              event.message.indexOf('WebSocket') !== -1 ||
              event.message.indexOf('ws://') !== -1 ||
              event.message.indexOf('wss://') !== -1
            ))
          ) {
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var reasonStr = String(reason || '');
          var stackStr = String((reason && reason.stack) || '');
          if (
            reasonStr.indexOf('WebSocket') !== -1 ||
            reasonStr.indexOf('@vite/client') !== -1 ||
            stackStr.indexOf('@vite/client') !== -1
          ) {
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
          }
        });
      })();
    </script>
